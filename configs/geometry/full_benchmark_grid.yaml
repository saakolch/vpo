experiment:
  name: geometry_full_benchmark_grid
  output_root: pre_experiments/first_experiment
  status_file: pre_experiments/first_experiment/STATUS.md
  source_ledger: pre_experiments/first_experiment/SOURCE_LEDGER.md
  command_log: pre_experiments/first_experiment/LOCAL_COMMAND_LOG.md
  next_action: pre_experiments/first_experiment/NEXT_ACTION.md

safety:
  allow_main_experiments: false
  wandb_mode: disabled
  max_gpu_hours_without_override: 4
  submit_full_grid: false
  ultra_feedback_enabled: false

methods:
  active:
    - grpo
    - maxrl
    - max_at_k
    - multi_rlvr
    - vpo
  eval_aliases:
    maze:
      max_at_k: maxrl
    musique:
      max_at_k: maxrl
    eureqa:
      max_at_k: maxrl
  deferred:
    target_set:
      enabled: false
      description: "Fixed deployment scalar w_* variant of the VPO multi-answer structure."

defaults:
  seeds: [0]
  metric: official_task_metric
  dataset_split: test
  candidate_budgets: [1, 3, 10, 30]

stages:
  - id: 0
    name: synthetic_tensor_tests
    task: synthetic
    model: none
    estimated_gpu_hours: 0

  - id: 1
    name: maze_smoke_qwen3_0_6b
    task: maze
    model: Qwen/Qwen3-0.6B
    estimated_gpu_hours: 1
    partition_class: smoke
    seeds: [0]
    data:
      train_size: 16
      test_size: 8
      train_seed: 42
      test_seed: 4242
    training:
      epochs: 1
      total_training_steps: 1
      save_freq: 1
      n_gpus: 1
    eval:
      n_chains: 2
      max_tokens: 256
      temperature: 0.7

  - id: 2
    name: maze_official_qwen3_4b
    task: maze
    model: Qwen/Qwen3-4B
    estimated_gpu_hours: 8
    partition_class: official
    seeds: [0]
    data:
      train_size: 1000
      test_size: 100
      train_seed: 42
      test_seed: 4242
    training:
      epochs: 50
      n_gpus: 4
    eval:
      n_chains: 10
      max_tokens: 1024
      temperature: 0.7

  - id: 3
    name: musique_qwen3_1_7b
    task: musique
    model: Qwen/Qwen3-1.7B
    estimated_gpu_hours: 12
    partition_class: official
    seeds: [0]
    data:
      max_train: -1
      max_test: -1
    training:
      epochs: 1
      n_gpus: 4
    eval:
      n_chains: 10
      num_examples: 300
      n_weights: 100
      max_tokens: 512
      temperature: 0.7
      max_model_len: 6400
      tp: 1
      gpu_mem: 0.85
      mv_k_values: "1,2,3,5,10,15,20,30"
      mv_n_subsets: 50

  - id: 4
    name: eureqa_qwen3_8b
    task: eureqa
    model: Qwen/Qwen3-8B
    estimated_gpu_hours: 24
    partition_class: official
    seeds: [0]
    data:
      mode: mixed_split
      mixed_split_seed: 0
      max_train: -1
      max_test: -1
    training:
      epochs: 6
      n_gpus: 4
      overrides:
        - ++data.train_batch_size=64
        - ++actor_rollout_ref.actor.ppo_mini_batch_size=32
        - ++actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=2
        - ++actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=2
        - ++actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=2
    eval:
      n_chains: 10
      num_prompts: null
      max_tokens: 2048
      temperature: 0.7
      max_model_len: 4096
      tp: 1
      gpu_mem: 0.85

  - id: 5
    name: toolrl_qwen3_1_7b
    task: tool
    model: Qwen/Qwen3-1.7B
    estimated_gpu_hours: 12
    partition_class: official
    seeds: [0]
    data:
      source_dir: null
    training:
      epochs: 20
      n_gpus: 4
    eval:
      n_chains: 10
      num_prompts: 80
      max_tokens: 2048
      temperature: 0.7
      max_model_len: 6144
      tp: 1
      gpu_mem: 0.85

  - id: 6
    name: ultrafeedback_armorm_deferred
    task: ultrafeedback
    model: Qwen/Qwen3-1.7B
    estimated_gpu_hours: 16
    partition_class: official
    enabled: false
    deferred_reason: "Enable after the official benchmark pipeline is stable and ArmoRM provenance is pinned."
    reward_model:
      name: ArmoRM
      implementation: deferred
